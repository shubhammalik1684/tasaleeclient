<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Tinos:wght@400;700&display=swap">
  <style>
    :root{color-scheme:light;--navy:#0B1D45;--ink:#2C3138;--ink2:#5A6875;--y:#F5E4AC;}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;
      background:var(--navy);color:#fff;font-family:"Tinos","Times New Roman",Times,serif;
      font-variant-numeric:lining-nums tabular-nums;padding:clamp(24px,5vw,64px);
      background-image:radial-gradient(120% 90% at 70% 10%,#1E4382 0%,#16336B 44%,#0B1D45 100%);}
    .w{max-width:min(640px,100%);text-align:left;position:relative;z-index:1}
    .mk{width:74px;height:74px;background:url("img/mark.png") center/contain no-repeat;
      margin-bottom:28px}
    h1{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-weight:600;
      font-size:clamp(40px,6vw,64px);line-height:1.04;margin:0 0 14px;letter-spacing:-.01em}
    .sub{font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-size:clamp(19px,2.4vw,25px);
      color:var(--y);margin-bottom:20px}
    p{font-size:17px;line-height:1.62;max-width:52ch;color:rgba(255,255,255,.8);font-weight:400;margin:0 0 30px}
    a.btn{display:inline-block;text-decoration:none;background:#fff;color:#102A5C;
      padding:13px 24px;border-radius:4px;font-size:16px;
      transition:background 240ms cubic-bezier(.2,.7,.3,1)}
    a.btn:hover{background:#EAF2FA}
    .ft{margin-top:38px;font-size:14px;color:rgba(255,255,255,.5)}
  </style>
</head>
<body>
  <div class="w">
    <div class="mk" role="img" aria-label="Tasalee"></div>
    <h1>That page is not on the record.</h1>
    <div class="sub">Which, in our line of work, is worth checking.</div>
    <p>The address you followed does not exist here. It may have moved, or it may
       never have been there. Either way, the front page has everything.</p>
    <a class="btn" href="/">Back to Tasalee</a>
    <div class="ft">Tasalee Property Assurance, Gurugram and Delhi NCR</div>
  </div>

</html>
